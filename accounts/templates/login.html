{% block contect %}

<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
</head>
<body>
    <div>
        <h1>Sign in</h1>
        <form methos="post">
            {% csrf_token %}
            <p>
                <label>Username:</label>

        </form>
    </div>
    {% endblock %}
</body>
</html>
